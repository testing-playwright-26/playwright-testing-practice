name: Schedule Login Test

# This schedules the test ex: 15:00 (3 pm) UTC + 5 hours 30 minutes = 8:30 PM IST
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

     
      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run LoginTest
        run: mvn test -Dtest=LoginTest
